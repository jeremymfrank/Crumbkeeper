name: Android tester APK
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - '.github/workflows/android-debug.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Crumbkeeper-v0.1.5-testers
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish public tester pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.1.5-testers" \
            "app/build/outputs/apk/debug/app-debug.apk#Crumbkeeper-v0.1.5-testers.apk" \
            --target "$GITHUB_SHA" \
            --title "Crumbkeeper v0.1.5 — Tester Preview" \
            --notes-file "docs/TESTER_RELEASE.md" \
            --prerelease

